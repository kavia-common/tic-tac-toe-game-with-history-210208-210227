[pytest]
addopts = -ra -q --maxfail=1
testpaths = tests
python_files = test_*.py
pythonpath = src
filterwarnings =
    ignore::DeprecationWarning

[flake8]
# Limit linting to our source and tests; ignore third-party packages in .venv
exclude = .venv,venv,build,dist,__pycache__
max-line-length = 100
per-file-ignores =
    # Allow unused imports in __init__ if any get added in future
    src/api/__init__.py:F401
